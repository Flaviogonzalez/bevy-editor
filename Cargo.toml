[workspace]
members = ["crates/vs_graph", "crates/vs_editor", "crates/vs_bevy", "crates/vs_nodes", "crates/vs_project", "tools/gen_math", "tools/dump_components", "crates/vs_tests"]
default-members = ["crates/vs_editor"]
resolver = "3"
exclude = ["experiments"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
vs_graph = { path = "crates/vs_graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lighter debug builds: line tables only for our crates (backtraces still have lines), none for
# dependencies. Most of the link time and memory of a Bevy build is debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
