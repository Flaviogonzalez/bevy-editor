[package]
name = "vs_tests"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Checks that the Lua preview and the generated Rust behave identically, on scripts that use every node."

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["std", "bevy_log", "bevy_color", "keyboard", "mouse"] }

[build-dependencies]
vs_graph.workspace = true

[dev-dependencies]
vs_bevy = { path = "../vs_bevy" }
vs_graph.workspace = true
serde_json = "1"
