[package]
name = "vs_editor"
version = "0.1.0"
edition.workspace = true

[dependencies]
# GPUI (Zed's `gpui-pre` snapshot, re-exported at the crate root), its platform, and the
# gpui-component library with default assets. gpui-kit pins the exact GPUI version.
gpui_kit = { package = "gpui-kit", version = "0.9" }
vs_graph.workspace = true
vs_project = { path = "../vs_project" }
rfd = "0.18"
anyhow = "1"
